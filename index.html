<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#38734d"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Djurträdgården</title><style>*{box-sizing:border-box}body{margin:0;background:#e8f4df;color:#234b35;font:600 18px system-ui}main{max-width:530px;margin:auto;padding:16px}h1,h2,p.center{text-align:center}h1{font-size:27px}h2{font-size:24px}button,input{font:inherit}button{background:white;color:#234b35;border:0;border-radius:18px;padding:15px;box-shadow:0 3px 0 #bfd5b8;cursor:pointer}button:disabled{opacity:.45}button:focus-visible{outline:3px solid #245d39}.big{display:block;width:100%;margin:12px 0;font-size:21px}.green{background:#a7dfa9}.yellow{background:#fff0bb}.purple{background:#e8e1fa}.panel{background:white;border-radius:24px;padding:18px;margin:14px 0}.symbol{font-size:110px;text-align:center;line-height:1.3}.symbol img{max-width:100%;height:180px;object-fit:contain}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row button{flex:1}.bar{height:12px;background:#dcebd6;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#4c9e63}.task{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:10px 0}.task img{width:48px;height:48px;object-fit:cover;border-radius:8px}.task span{font-size:32px}.garden{background:linear-gradient(#d9f1ff 0 32%,#c3e9b0 32%);border-radius:22px;min-height:200px;padding:15px}.animals{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.animal{min-width:0;overflow-wrap:anywhere;padding:8px;font-size:15px}.animal b{display:block;font-size:42px}.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.shop button{padding:10px 4px;font-size:15px}.shop b{display:block;font-size:36px}label{display:block;margin:12px 0}input:not([type=file]){width:100%;padding:10px;border:1px solid #9ebca1;border-radius:8px}input[type=file]{max-width:100%;font-size:15px}small{font-weight:400}.conf{position:fixed;top:-35px;pointer-events:none;animation:fall 2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}@media(prefers-reduced-motion:reduce){.conf{display:none}}</style></head><body><main id="app"></main><script>
const initial={morning:[['🚽','Gå på toaletten'],['👕','Ta på kläder'],['🥣','Äta frukost'],['🪥','Borsta tänderna'],['🪮','Borsta håret'],['🧥','Ta på ytterkläder']],home:[['👟','Ställ skorna på plats'],['🧥','Häng upp jackan'],['🎒','Häng upp väskan'],['🧼','Tvätta händerna'],['🍎','Ät mellanmål']],night:[['🧸','Plocka undan leksaker'],['🚽','Gå på toaletten'],['👚','Ta på pyjamas'],['🪥','Borsta tänderna'],['📖','Lyssna på godnattsaga'],['🛏️','Gå och lägga sig']]};const titles={morning:'☀️ GOD MORGON',home:'🏡 HEMMA IGEN',night:'🌙 GOD NATT'},key='djurtradgarden-v1',app=document.getElementById('app');let s={name:'',routines:Object.fromEntries(Object.entries(initial).map(([p,a])=>[p,a.map(([icon,text],i)=>({id:p+i,icon,text}))])),photos:{},leaves:0,animals:[],done:{},earned:{},date:'',auto:true};try{Object.assign(s,JSON.parse(localStorage.getItem(key)||'{}'))}catch{}let page='start',mode='one',lastSpoken='';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{alert('Det gick inte att spara. Telefonens lagring kan vara full.')}}function reset(){let d=new Date(),k=[d.getFullYear(),d.getMonth()+1,d.getDate()].join('-');if(s.date!==k){s.date=k;s.done={};s.earned={};save()}}function weekend(){return [0,6].includes(new Date().getDay())}function say(t){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(t);u.lang='sv-SE';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}}function go(p){if('speechSynthesis'in window)speechSynthesis.cancel();page=p;mode='one';lastSpoken='';render(true);window.scrollTo(0,0)}function back(){return '<button onclick="go(\'start\')">← HEM</button>'}function pic(t){return s.photos[t.id]?`<img alt="" src="${esc(s.photos[t.id])}">`:`<span>${esc(t.icon)}</span>`}function mark(id){reset();if(weekend()||!s.routines[page]?.some(t=>t.id===id)||s.done[id])return;s.done[id]=true;if(!s.earned[id]){s.leaves++;s.earned[id]=true}save();if(s.routines[page].every(t=>s.done[t.id]))celebrate();render(true)}function celebrate(){for(let i=0;i<24;i++){let e=document.createElement('span');e.className='conf';e.textContent=['🌷','🍃','⭐'][i%3];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.4+'s';document.body.append(e);setTimeout(()=>e.remove(),2500)}}const items=[['🐱','Katt',2],['🐶','Hund',2],['🐰','Kanin',2],['🌷','Blomma',1],['🏡','Djurhus',3],['🦋','Fjäril',1]];function buy(i){let a=items[i];if(!a||s.leaves<a[2])return;s.leaves-=a[2];s.animals.push({type:i,name:a[1]});save();render()}function rename(i){let a=s.animals[i];if(!a)return;let n=prompt('Vad ska den heta?',a.name);if(n!==null){a.name=n.trim().slice(0,30)||items[a.type][1];save();render()}}function help(){document.getElementById('help').innerHTML='<p>💚 VISA UPPDRAGET FÖR EN VUXEN.</p>';say('Det är okej att be om hjälp. Visa uppdraget för en vuxen.')}function photo(input,id){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,400/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);s.photos[id]=c.toDataURL('image/jpeg',.8);save();render()};im.src=r.result};r.readAsDataURL(f)}function render(auto=false){reset();if(page==='start'){app.innerHTML=`<h1>🌿 ${s.name?esc(s.name.toUpperCase())+'S ':''}DJURTRÄDGÅRD</h1><div class="panel center" style="text-align:center;background:#cce7b9"><div style="font-size:62px">🐱 🐰 🐶</div><h2>HEJ ${esc(s.name.toUpperCase()||'KOMPIS')}!</h2>EN SAK I TAGET 💚</div>${weekend()?'<div class="panel">🌷 HELG! LEDIGT FRÅN UPPDRAG.</div>':Object.entries(titles).map(([p,t],i)=>`<button class="big ${['yellow','green','purple'][i]}" onclick="go('${p}')">${t}</button>`).join('')}<button class="big" onclick="go('garden')">🐾 MIN DJURTRÄDGÅRD · ${s.leaves} 🍃</button><button onclick="go('parent')">⚙️ FÖRÄLDRALÄGE</button>`;return}if(s.routines[page]){if(weekend()){go('start');return}let a=s.routines[page],n=a.filter(t=>s.done[t.id]).length,t=a.find(t=>!s.done[t.id]);app.innerHTML=back()+`<h1>${titles[page]}</h1><p class="center">${n} AV ${a.length} KLARA</p><div class="bar"><i style="width:${a.length?n/a.length*100:100}%"></i></div><div class="row" style="margin-top:12px"><button onclick="mode='one';render(true)">EN I TAGET</button><button onclick="mode='all';render()">VISA ALLA</button></div>`+(mode==='all'?a.map(x=>`<button class="task ${s.done[x.id]?'green':''}" ${s.done[x.id]?'disabled':''} onclick="mark('${x.id}')">${pic(x)} ${s.done[x.id]?'✓ ':''}${esc(x.text.toUpperCase())}</button>`).join(''):t?`<div class="panel"><div class="symbol">${pic(t)}</div><h2>${esc(t.text.toUpperCase())}</h2><button class="big green" onclick="mark('${t.id}')">✓ JAG ÄR KLAR!</button><button class="big" onclick="say(${esc(JSON.stringify(t.text))})">🔊 LYSSNA</button></div>`:`<div class="panel"><div class="symbol">🐰🎉</div><h2>DU FIXADE DET!</h2><button class="big green" onclick="go('garden')">MIN DJURTRÄDGÅRD</button></div>`)+`<button class="big" onclick="help()">💚 HJÄLP MIG</button><div id="help"></div>`;if(auto&&mode==='one'&&s.auto&&t&&lastSpoken!==t.id){lastSpoken=t.id;say(t.text)}return}if(page==='garden'){app.innerHTML=back()+`<h1>🐾 MIN DJURTRÄDGÅRD</h1><h2>🍃 ${s.leaves} LÖV KVAR</h2><div class="garden"><p class="center" style="font-size:34px">🌳 ☀️ 🌳</p><div class="animals">${s.animals.map((a,i)=>`<button class="animal" onclick="rename(${i})"><b>${items[a.type][0]}</b>${esc(a.name)}</button>`).join('')}</div><p class="center">🌼 🌿 🌷</p></div><p class="center">VÄLJ NÅGOT TILL TRÄDGÅRDEN</p><div class="shop">${items.map((a,i)=>`<button ${s.leaves<a[2]?'disabled':''} onclick="buy(${i})"><b>${a[0]}</b>${a[1].toUpperCase()}<br>${a[2]} 🍃</button>`).join('')}</div><p><small>Tryck på ett djur för att ge det ett namn. Dina djur och löv sparas. Nya löv kommer från vardagsuppdragen.</small></p>`;return}if(page==='parent'){app.innerHTML=back()+`<h1>FÖRÄLDRALÄGE</h1><div class="panel"><label>Barnets namn<input value="${esc(s.name)}" onchange="s.name=this.value;save()"></label><label><input style="width:auto" type="checkbox" ${s.auto?'checked':''} onchange="s.auto=this.checked;save()"> Automatisk uppläsning</label><small>Helger är lediga. Föräldraläget är inte låst. Uppgifter och bilder sparas bara på denna enhet.</small></div>${Object.entries(s.routines).map(([p,a])=>`<div class="panel"><h2>${titles[p]}</h2>${a.map((t,i)=>`<label>${esc(t.icon)} Uppdrag ${i+1}<input value="${esc(t.text)}" onchange="s.routines.${p}[${i}].text=this.value;save()"></label><label>Eget foto<input type="file" accept="image/*" onchange="photo(this,'${t.id}')"></label>${s.photos[t.id]?`<button onclick="delete s.photos['${t.id}'];save();render()">Ta bort foto</button>`:''}<button onclick="removeTask('${p}',${i})">Ta bort uppdrag</button><hr>`).join('')}<button onclick="addTask('${p}')">+ Lägg till uppdrag</button></div>`).join('')}`}}function addTask(p){let t=prompt('Nytt uppdrag');if(t?.trim()){s.routines[p].push({id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),icon:'⭐',text:t.trim()});save();render()}}function removeTask(p,i){if(confirm('Ta bort uppdraget?')){let t=s.routines[p].splice(i,1)[0];delete s.photos[t.id];save();render()}}render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
